<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fixel — variable typeface</title>
    <meta
      name="description"
      content="A study rebuild of a variable-typeface landing page: hover-reactive wordmark, scroll reveals, and a live variable-font playground."
    />
    <link rel="preload" href="/fonts/FixelVariable.ttf" as="font" type="font/ttf" crossorigin />
  </head>

  <body>
    <!-- Hero shell -->
    <header class="header">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="2" />
          <path
            d="M16 6a10 10 0 1 0 10 10"
            fill="none"
            stroke="currentColor"
            stroke-width="4"
            stroke-linecap="round"
          />
        </svg>
        <span class="brand__name">Fixel</span>
        <span class="brand__product">typeface</span>
      </div>

      <button class="leave-feedback-button" type="button" data-leave-feedback>
        Leave feedback
      </button>

      <div class="feedback-form-wrapper" role="dialog" aria-label="Leave feedback">
        <button class="feedback-form-close" type="button" data-feedback-close aria-label="Close">
          &times;
        </button>

        <div class="feedback-form-title">Leave feedback</div>

        <form class="feedback-form" data-feedback-form novalidate>
          <textarea
            name="message"
            placeholder="What works, what breaks, what you would change"
            required
          ></textarea>

          <label class="feedback-file">
            <span>Attach a file (max 10 MB)</span>
            <input type="file" name="attachment" />
          </label>

          <div class="submit-wrapper">
            <button class="feedback-submit" type="submit" data-submit>Send</button>
          </div>

          <p class="success-message">Thanks — feedback recorded locally.</p>
          <p class="error-message">That file is over 10 MB. Try a smaller one.</p>
        </form>
      </div>

      <div class="hero">
        <h1 class="Heading">
          <span
            >F<img class="hero-art" src="/img/hero-tail.svg" alt="" aria-hidden="true"
          /></span>
          <span>i</span>
          <span>x</span>
          <span>e</span>
          <span
            >l<img class="hero-art" src="/img/hero-head.svg" alt="" aria-hidden="true"
          /></span>
        </h1>
      </div>
    </header>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
